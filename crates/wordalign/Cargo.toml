[package]
name = "avskrift-wordalign"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# GPU via DirectML (Windows). The app's bundled onnxruntime.dll already contains the DML provider.
directml = ["ort/directml"]

[dependencies]
anyhow = "1"
ort = "=2.0.0-rc.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
hound = "3.5"
